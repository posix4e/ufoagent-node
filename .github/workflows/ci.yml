name: ci

# Build once, then test the real artifact. `build` lints/tests/compiles and produces the Inno
# installer; `test` downloads that installer, runs it (with live logging), waits for UFO2 to
# auto-provision, then drives the INSTALLED 🛸 tray with FlaUI. One pipeline, no rebuilds.
# On main, when EVERY step passes, the final `test` step ships that exact installer to the
# rolling `beta` prerelease. Production stays on v* tags -> `latest` (release.yml).
# Same-repo runs also do a LINKED smoke: the agent gets a pre-provisioned CI node token and the
# run drives a real command through the control plane (enqueue -> DO -> WS -> execute -> result).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint + unit + build + installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --all
      - name: Build (release)
        run: cargo build --release
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          # Stamp crate version + short sha so beta installs are identifiable in Add/Remove
          # Programs (tagged releases pass the bare version — see release.yml).
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $sha = '${{ github.sha }}'.Substring(0, 7)
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver-beta.$sha" 'installer\ufoagent.iss'
          $setup = Get-ChildItem -Recurse -Filter 'ufoagent-setup.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $setup) { throw 'installer not produced' }
          Copy-Item $setup (Join-Path $env:RUNNER_TEMP 'ufoagent-setup.exe')
          Write-Host "installer: $setup"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: ${{ runner.temp }}/ufoagent-setup.exe
          if-no-files-found: error

  test:
    name: install + provision + link + tray GUI (installed app)
    needs: build
    runs-on: windows-latest
    # Provision (~8m) + linked smoke + TWO genuine UFO2 runs (remote + local, up to ~6m each) +
    # the tray GUI — give it room so a slow UFO2 run doesn't trip the job timeout.
    timeout-minutes: 45
    permissions:
      contents: write # the final main-only step re-points the rolling beta release
    env:
      # Pre-provisioned CI node credentials (empty on fork PRs -> the linked smoke skips).
      CI_AGENT_TOKEN: ${{ secrets.CI_AGENT_TOKEN }}
      CI_AGENT_ID: ${{ secrets.CI_AGENT_ID }}
      CI_ADMIN_TOKEN: ${{ secrets.CI_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4 # for tests/gui/TrayTest
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: dl

      - name: Silent install (live Inno log, git stripped, 5-min guard)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem -Recurse dl -Filter ufoagent-setup.exe | Select-Object -First 1).FullName
          if (-not $setup) { throw 'installer artifact missing' }
          Add-MpPreference -ExclusionPath "$env:ProgramFiles\UFOAgent", (Join-Path (Get-Location) 'dl') -ErrorAction SilentlyContinue
          # Strip git so the installer's background bootstrap must use the zip download.
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'git.exe')) }) -join ';'
          if (Get-Command git -ErrorAction SilentlyContinue) { Write-Host 'note: git still resolvable' } else { Write-Host 'git removed from PATH' }
          $log = Join-Path $env:RUNNER_TEMP 'inno-install.log'
          "INNO_LOG=$log" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "installing: $setup"
          $p = Start-Process "$setup" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCANCEL',"/LOG=$log" -PassThru
          $deadline = (Get-Date).AddMinutes(5); $seen = 0
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            if (Test-Path $log) {
              $lines = Get-Content $log
              if ($lines.Count -gt $seen) { $lines[$seen..($lines.Count - 1)] | ForEach-Object { Write-Host "  [inno] $_" }; $seen = $lines.Count }
            }
          }
          if (-not $p.HasExited) {
            Write-Host '::error::installer did not finish within 5 minutes'
            if (Test-Path $log) { Get-Content $log | Write-Host }
            $p | Stop-Process -Force -ErrorAction SilentlyContinue
            throw 'installer hung'
          }
          if (-not (Test-Path "$env:ProgramFiles\UFOAgent\ufoagent.exe")) { throw 'ufoagent.exe was not installed' }
          Write-Host "installer exit code: $($p.ExitCode)"

      - name: Service running + standard commands (installed exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:ProgramFiles\UFOAgent\ufoagent.exe"
          Start-Sleep -Seconds 5
          $svc = sc.exe query UFOAgent | Out-String; Write-Host $svc
          if ($svc -notmatch 'RUNNING|START_PENDING') { throw 'UFOAgent service is not running' }
          Write-Host '--- version ---';     & $exe version
          Write-Host '--- configure ---';   & $exe configure --control-plane https://app.ufoagent.xyz
          Write-Host '--- status ---';      $st = & $exe status | Out-String; Write-Host $st
          if ($st -notmatch 'app\.ufoagent\.xyz') { throw 'configure did not persist' }
          Write-Host '--- update ---';      & $exe update
          Write-Host '--- link --help ---'; & $exe link --help | Out-Null
          $r = Invoke-WebRequest 'https://app.ufoagent.xyz/v1/agent/version' -UseBasicParsing -TimeoutSec 20
          if ($r.StatusCode -ne 200) { throw 'control plane unreachable from the node' }
          Write-Host 'standard commands OK'

      - name: Wait for the installer to auto-provision UFO2 (no git)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe  = "$env:ProgramFiles\UFOAgent\ufoagent.exe"
          $alog = "$env:ProgramData\UFOAgent\logs\ufoagent.log"
          $deadline = (Get-Date).AddMinutes(12); $seen = 0; $ok = $false
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $alog) {
              $lines = Get-Content $alog
              if ($lines.Count -gt $seen) { $lines[$seen..($lines.Count - 1)] | ForEach-Object { Write-Host "  [agent] $_" }; $seen = $lines.Count }
            }
            $st = & $exe status | Out-String
            if (($st -notmatch 'ufo_home:\s+\(unset\)') -and ($st -notmatch 'python:\s+\(unset\)')) { Write-Host $st; $ok = $true; break }
            # Fail fast: bootstrap logs its verdict on failure — don't burn the full timeout.
            if ((Test-Path $alog) -and (Select-String -Path $alog -Pattern 'UFO2 setup failed' -Quiet)) {
              throw 'bootstrap reported failure (see [agent] log above)'
            }
            Start-Sleep -Seconds 10
          }
          if (-not $ok) {
            Write-Host '::error::installer did not auto-provision UFO2 within 12 minutes'
            if (Test-Path $alog) { Get-Content $alog | Write-Host }
            throw 'auto-provision timed out'
          }
          Write-Host 'installer auto-provisioned UFO2 (no git) OK'

      - name: Linked smoke — WS connect + command round-trip through the live control plane
        if: env.CI_AGENT_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe  = "$env:ProgramFiles\UFOAgent\ufoagent.exe"
          $alog = "$env:ProgramData\UFOAgent\logs\ufoagent.log"
          # Hand the pre-provisioned CI node token to the installed agent; the service's WS loop
          # polls the store every 30s and connects as soon as it appears.
          & $exe configure --agent-token $env:CI_AGENT_TOKEN
          $deadline = (Get-Date).AddMinutes(3); $seen = 0; $connected = $false
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $alog) {
              $lines = Get-Content $alog
              if ($lines.Count -gt $seen) { $lines[$seen..($lines.Count - 1)] | ForEach-Object { Write-Host "  [agent] $_" }; $seen = $lines.Count }
              if (($lines | Select-String 'ws: connected to control plane').Count -gt 0) { $connected = $true; break }
            }
            Start-Sleep -Seconds 5
          }
          if (-not $connected) { throw 'agent never connected to the control plane over WebSocket' }
          Write-Host 'WS connected - enqueueing a repair command via the control plane API...'
          $hdr = @{ authorization = "Bearer $env:CI_ADMIN_TOKEN"; 'content-type' = 'application/json' }
          $base = "https://app.ufoagent.xyz/api/agents/$env:CI_AGENT_ID/commands"
          $resp = Invoke-RestMethod -Method POST -Uri $base -Headers $hdr -Body '{"kind":"repair"}'
          Write-Host "enqueued: id=$($resp.id) status=$($resp.status)"
          $deadline = (Get-Date).AddMinutes(2); $done = $false
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $alog) {
              $lines = Get-Content $alog
              if ($lines.Count -gt $seen) { $lines[$seen..($lines.Count - 1)] | ForEach-Object { Write-Host "  [agent] $_" }; $seen = $lines.Count }
            }
            $hist = Invoke-RestMethod -Uri $base -Headers $hdr
            $cmd = $hist.commands | Where-Object { $_.id -eq $resp.id }
            if ($cmd -and $cmd.status -eq 'done')   { Write-Host "command done: $($cmd.result)"; $done = $true; break }
            if ($cmd -and $cmd.status -eq 'failed') { throw "command failed: $($cmd.result)" }
            Start-Sleep -Seconds 5
          }
          if (-not $done) { throw 'repair command did not reach done within 2 minutes' }
          Write-Host 'linked smoke OK: enqueue -> DO push -> agent WS -> execute -> result'

      - name: Start the tray (run_task executor, Session 1)
        if: env.CI_AGENT_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:ProgramFiles\UFOAgent\ufoagent.exe"
          # run_task runs UFO2 on the interactive desktop via the tray; start it and wait until it
          # advertises liveness (the marker the service checks before queuing a task).
          Start-Process $exe -ArgumentList 'tray'
          $alive = "$env:ProgramData\UFOAgent\tasks\tray-alive"
          $deadline = (Get-Date).AddMinutes(2)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $alive)) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $alive)) { throw 'tray did not start (no tray-alive marker)' }
          Write-Host 'tray running; tray-alive present'

      - name: Remote run_task — UFO2 actually opens Notepad (real task, screenshot + assert)
        if: env.CI_AGENT_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $alog = "$env:ProgramData\UFOAgent\logs\ufoagent.log"
          $shots = "$env:RUNNER_TEMP\shots"; New-Item -ItemType Directory -Force -Path $shots | Out-Null
          function Save-Shot($name) {
            try {
              Add-Type -AssemblyName System.Windows.Forms,System.Drawing
              $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
              $bmp.Save((Join-Path $shots "$name.png")); $g.Dispose(); $bmp.Dispose()
              Write-Host "screenshot: $name.png"
            } catch { Write-Host "screenshot $name failed: $($_.Exception.Message)" }
          }
          # Clean slate: close the lingering "UFOAgent setup" bootstrap console (deferred --pause) so
          # screenshots are legible, and ensure no Notepad is open before the test.
          Get-Process | Where-Object { $_.MainWindowTitle -like '*UFOAgent setup*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $hdr = @{ authorization = "Bearer $env:CI_ADMIN_TOKEN"; 'content-type' = 'application/json' }
          $base = "https://app.ufoagent.xyz/api/agents/$env:CI_AGENT_ID/commands"
          $body = '{"kind":"run_task","request":"Open the Notepad application."}'
          $resp = Invoke-RestMethod -Method POST -Uri $base -Headers $hdr -Body $body
          Write-Host "enqueued run_task: id=$($resp.id) status=$($resp.status)"
          # The REAL assertion: UFO2 (real key) must actually open Notepad. No faking — if notepad.exe
          # never appears, the test fails. Stream the agent log while we wait.
          $deadline = (Get-Date).AddMinutes(5); $seen = 0; $opened = $false
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $alog) {
              $lines = Get-Content $alog
              if ($lines.Count -gt $seen) { $lines[$seen..($lines.Count - 1)] | ForEach-Object { Write-Host "  [agent] $_" }; $seen = $lines.Count }
            }
            if (Get-Process notepad -ErrorAction SilentlyContinue) { $opened = $true; break }
            Start-Sleep -Seconds 5
          }
          Save-Shot '10-remote-notepad'
          if (-not $opened) {
            Get-Content $alog -Tail 50 | Write-Host
            $tlog = "$env:ProgramData\UFOAgent\tasks\logs\$($resp.id).txt"
            if (Test-Path $tlog) { Write-Host '--- task transcript ---'; Get-Content $tlog -Tail 60 | Write-Host }
            throw 'UFO2 did not open Notepad — run_task did not actually perform the task'
          }
          Write-Host 'UFO2 opened Notepad on the desktop (notepad.exe running) — real task performed'
          # The result round-trip is already proven by the linked smoke (repair); here it is just
          # informational, so don't burn minutes waiting on UFO2's full loop — a short peek is enough.
          $deadline = (Get-Date).AddSeconds(45); $final = $null
          while ((Get-Date) -lt $deadline) {
            $cmd = (Invoke-RestMethod -Uri $base -Headers $hdr).commands | Where-Object { $_.id -eq $resp.id }
            if ($cmd -and ($cmd.status -eq 'done' -or $cmd.status -eq 'failed')) { $final = $cmd; break }
            Start-Sleep -Seconds 5
          }
          if ($final) { Write-Host "run_task result: status=$($final.status)" } else { Write-Host '::warning::result still pending (UFO2 may still be running)' }
          Get-Process notepad,python,pythonw -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Local run_task — `ufoagent run` makes UFO2 actually open Notepad (real, instrumented)
        if: env.CI_AGENT_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:ProgramFiles\UFOAgent\ufoagent.exe"
          $alog = "$env:ProgramData\UFOAgent\logs\ufoagent.log"
          $shots = "$env:RUNNER_TEMP\shots"
          # Real UFO2 task via the local CLI path. Clean slate so we start fresh, capture UFO2's own
          # stdout/stderr to a file so a failure is diagnosable (the missing piece last time), and
          # stream the agent log while we wait. NO faking — UFO2 must genuinely open Notepad.
          Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $rout = "$env:RUNNER_TEMP\local-run.out.txt"; $rerr = "$env:RUNNER_TEMP\local-run.err.txt"
          # Pass the command line as a SINGLE quoted string — Start-Process -ArgumentList with an
          # array does NOT quote the spaced request, so clap saw 'Open'/'the'/'Notepad'/... as stray
          # positional args and bailed ("try --help"). One string = clap gets the quoted request.
          Start-Process $exe -ArgumentList 'run --task adhoc -r "Open the Notepad application."' -RedirectStandardOutput $rout -RedirectStandardError $rerr
          $deadline = (Get-Date).AddMinutes(6); $seen = 0; $opened = $false
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $alog) {
              $lines = Get-Content $alog
              if ($lines.Count -gt $seen) { $lines[$seen..($lines.Count - 1)] | ForEach-Object { Write-Host "  [agent] $_" }; $seen = $lines.Count }
            }
            if (Get-Process notepad -ErrorAction SilentlyContinue) { $opened = $true; break }
            Start-Sleep -Seconds 5
          }
          try {
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height); $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size); $bmp.Save((Join-Path $shots '11-local-notepad.png')); $g.Dispose(); $bmp.Dispose()
          } catch {}
          if (-not $opened) {
            Write-Host '--- ufoagent run stdout ---'; if (Test-Path $rout) { Get-Content $rout | Write-Host }
            Write-Host '--- ufoagent run stderr ---'; if (Test-Path $rerr) { Get-Content $rerr | Write-Host }
            Write-Host '--- agent log tail ---'; if (Test-Path $alog) { Get-Content $alog -Tail 40 | Write-Host }
            Get-Process python,pythonw -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            throw 'local `ufoagent run` did not actually open Notepad (UFO2 did not perform the task)'
          }
          Get-Process notepad,python,pythonw -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'local run_task: UFO2 actually opened Notepad via `ufoagent run` — real task performed'

      - name: Taskbar — click "View log" in the tray, assert it lands in the log
        if: env.CI_AGENT_TOKEN != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $alog = "$env:ProgramData\UFOAgent\logs\ufoagent.log"
          # Attach to the already-running executor tray; FlaUI opens its menu and clicks "View log",
          # which opens ufoagent.log in Notepad — the on-node history of the commands run this build
          # (local + remote). The 'command-log' screenshot captures it.
          dotnet run --project tests/gui/TrayTest -- "$env:ProgramFiles\UFOAgent\ufoagent.exe" "$env:RUNNER_TEMP\shots" --attach
          $deadline = (Get-Date).AddSeconds(30); $logged = $false
          while ((Get-Date) -lt $deadline) {
            if ((Test-Path $alog) -and (Select-String -Path $alog -Pattern 'tray: menu action . view log' -Quiet)) { $logged = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $logged) { Get-Content $alog -Tail 30 | Write-Host; throw 'tray View log click did not show up in the log' }
          Write-Host 'taskbar action showed up in the log (tray: menu action — view log)'

      - name: Publish real screenshots to the site (main, after a green run)
        if: github.event_name == 'push' && env.CI_AGENT_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shots="$RUNNER_TEMP/shots"
          rm -rf pub && mkdir pub
          # Curate the illustrative shots; only what exists (steps that ran are guaranteed real
          # because the e2e hard-asserts notepad.exe opened and cleans the desktop first).
          cp "$shots/10-remote-notepad.png" pub/remote-task.png   2>/dev/null || true
          cp "$shots/11-local-notepad.png"  pub/local-task.png    2>/dev/null || true
          cp "$shots/command-log.png"       pub/command-log.png   2>/dev/null || true
          cp "$shots/menu-open.png"         pub/tray-menu.png      2>/dev/null || true
          ls -la pub
          # Force-push a single fresh commit to an orphan-style `screenshots` branch (no history
          # bloat on main, no PAT — same-repo GITHUB_TOKEN). The site hotlinks these via raw.
          cd pub && git init -q && git checkout -q -b screenshots
          git add .
          git -c user.email=ci@ufoagent.xyz -c user.name='ufoagent ci' commit -q -m "screenshots from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/ufoagent/ufoagent-node.git" screenshots
          echo "published screenshots from ${GITHUB_SHA}"

      - name: Publish rolling beta (main pushes only — runs only if every step above passed)
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          setup=$(find dl -name ufoagent-setup.exe | head -1)
          test -f "$setup"
          # Re-point the beta tag at this commit (the release follows its tag); stable URL:
          #   https://github.com/ufoagent/ufoagent-node/releases/download/beta/ufoagent-setup.exe
          git tag -f beta "$GITHUB_SHA"
          git push -f origin beta
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --prerelease --title "UFOAgent beta (rolling)" \
              --notes "Rolling beta: the newest main build that passed the full install + provision + tray GUI test suite. Want stable? Grab the latest production release instead."
          fi
          gh release upload beta "$setup" --clobber
          echo "beta -> $GITHUB_SHA"

      - name: Upload tray screenshots (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tray-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      - name: Capture diagnostics (always)
        if: always()
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'diag'; New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $pd = "$env:ProgramData\UFOAgent"
          Write-Host '===== Inno install log ====='
          if ($env:INNO_LOG -and (Test-Path $env:INNO_LOG)) { Get-Content $env:INNO_LOG | Write-Host; Copy-Item $env:INNO_LOG $diag -ErrorAction SilentlyContinue }
          Write-Host '===== agent log (tail) ====='
          $alog = Join-Path $pd 'logs\ufoagent.log'
          if (Test-Path $alog) { Get-Content $alog -Tail 200 | Write-Host; Copy-Item $alog $diag -ErrorAction SilentlyContinue }
          Write-Host '===== config.json ====='
          $cfg = Join-Path $pd 'config.json'
          if (Test-Path $cfg) { Get-Content $cfg | Write-Host; Copy-Item $cfg $diag -ErrorAction SilentlyContinue }
          Write-Host '===== service ====='
          sc.exe query UFOAgent | Out-String | Write-Host

      - name: Upload diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: ${{ runner.temp }}/diag
          if-no-files-found: ignore

      - name: Uninstall (always)
        if: always()
        shell: pwsh
        run: |
          Get-Process ufoagent -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $u = "$env:ProgramFiles\UFOAgent\unins000.exe"
          if (Test-Path $u) { Start-Process $u -ArgumentList '/VERYSILENT' -Wait; Write-Host 'uninstalled' }
