name: ci

# Fast per-PR gate: lint, unit tests, compile, and build the Inno installer. On main, when that passes,
# publish the exact installer to the rolling `beta` prerelease. Production stays on v* tags -> `latest`
# (release.yml).
#
# The full end-to-end — install + cold-provision on a BARE Windows VM + auto-logon + run_task GUI + tray
# menu + linked smoke + the marketing screenshots — is NOT here: it runs on a real headful VM in
# cold-vm.yml (workflow_run, right after this `ci` publishes beta), reusing the same tests/e2e +
# tests/gui scripts. A GitHub runner can't represent a bare customer box (it preinstalls VC++/MFC,
# Python, .NET) nor reboot into an auto-logon session — which is how the win32ui/MFC + tray-autostart
# bugs shipped "green" here before. So beta is gated by build, then verified on the VM after publish.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint + unit + build + installer
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write # main-only: re-point the rolling beta tag/release (publish step below)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --all
      - name: Build (release)
        run: cargo build --release
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          # Stamp crate version + short sha so beta installs are identifiable in Add/Remove
          # Programs (tagged releases pass the bare version — see release.yml).
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $sha = '${{ github.sha }}'.Substring(0, 7)
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver-beta.$sha" 'installer\ufoagent.iss'
          $setup = Get-ChildItem -Recurse -Filter 'ufoagent-setup.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $setup) { throw 'installer not produced' }
          Copy-Item $setup (Join-Path $env:RUNNER_TEMP 'ufoagent-setup.exe')
          Write-Host "installer: $setup"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: ${{ runner.temp }}/ufoagent-setup.exe
          if-no-files-found: error

      # Publish the rolling beta on main once build/unit/compile pass. cold-vm.yml then verifies THIS
      # exact beta on a real bare VM right after (verify-after-publish for a rolling prerelease).
      - name: Publish rolling beta (main only)
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          setup="$RUNNER_TEMP/ufoagent-setup.exe"
          test -f "$setup"
          # Re-point the beta tag at this commit (the release follows its tag); stable URL:
          #   https://github.com/ufoagent/ufoagent-node/releases/download/beta/ufoagent-setup.exe
          git tag -f beta "$GITHUB_SHA"
          git push -f origin beta
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --prerelease --title "UFOAgent beta (rolling)" \
              --notes "Rolling beta: the newest main build that passed lint/unit/compile. The full headful e2e (cold-vm) then verifies this exact build on a real bare Windows VM. Want stable? Grab the latest production release instead."
          fi
          gh release upload beta "$setup" --clobber
          echo "beta -> $GITHUB_SHA"
