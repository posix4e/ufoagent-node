name: e2e

# One job: build with the static CRT, prove ufoagent.exe has no VC++ runtime DLL dependency,
# install via the real Inno installer, exercise standard commands, then provision UFO2 with git
# stripped from PATH. Captures the Inno install log + agent log + config and uploads them as
# artifacts (and prints them inline) so a failure is never silent.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: clean install + commands + no-git provision
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release (static CRT)
        run: cargo build --release

      - name: Verify no VC++ runtime DLL dependency (crt-static)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $deps = & $dumpbin /dependents 'target\release\ufoagent.exe' | Out-String
          Write-Host $deps
          if ($deps -match 'VCRUNTIME140|MSVCP140') {
            throw 'VC++ runtime is still a dynamic dependency - crt-static not applied'
          }
          Write-Host 'OK: ufoagent.exe carries no VC++ runtime DLL dependency'

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.0-e2e 'installer\ufoagent.iss'
          $setup = Get-ChildItem -Recurse -Filter 'ufoagent-setup.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $setup) { throw 'installer not produced' }
          Write-Host "installer: $setup"
          "SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Silent install (async + live Inno log, 5-min guard)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Stop Defender re-scanning the freshly-built unsigned binaries on every launch.
          Add-MpPreference -ExclusionPath "$env:ProgramFiles\UFOAgent", (Join-Path (Get-Location) 'target\release') -ErrorAction SilentlyContinue
          $log = Join-Path $env:RUNNER_TEMP 'inno-install.log'
          "INNO_LOG=$log" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "installing: $env:SETUP"
          # Run async so we can stream the Inno log + enforce a hard timeout — an installer [Run]
          # item (service start, background bootstrap) can stall on a headless runner.
          $p = Start-Process "$env:SETUP" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCANCEL',"/LOG=$log" -PassThru
          $deadline = (Get-Date).AddMinutes(5); $seen = 0
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            if (Test-Path $log) {
              $lines = Get-Content $log
              if ($lines.Count -gt $seen) {
                $lines[$seen..($lines.Count - 1)] | ForEach-Object { Write-Host "  [inno] $_" }
                $seen = $lines.Count
              }
            }
          }
          if (-not $p.HasExited) {
            Write-Host '::error::installer did not finish within 5 minutes (a [Run] item is hanging)'
            if (Test-Path $log) { Write-Host '--- full inno log ---'; Get-Content $log | Write-Host }
            Get-CimInstance Win32_Process -Filter "Name='ufoagent.exe'" |
              ForEach-Object { Write-Host "ufoagent pid=$($_.ProcessId) cmd=$($_.CommandLine)" }
            $p | Stop-Process -Force -ErrorAction SilentlyContinue
            throw 'installer hung'
          }
          Write-Host "installer exit code: $($p.ExitCode)"
          $exe = "$env:ProgramFiles\UFOAgent\ufoagent.exe"
          if (-not (Test-Path $exe)) { throw 'ufoagent.exe was not installed' }
          Write-Host "installed: $exe"

      - name: Service running + standard commands
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:ProgramFiles\UFOAgent\ufoagent.exe"
          Start-Sleep -Seconds 5
          Write-Host '--- sc query UFOAgent ---'
          $svc = sc.exe query UFOAgent | Out-String; Write-Host $svc
          if ($svc -notmatch 'RUNNING|START_PENDING') { throw 'UFOAgent service is not running' }
          Write-Host '--- version ---';      & $exe version
          Write-Host '--- configure ---';    & $exe configure --control-plane https://app.ufoagent.xyz
          Write-Host '--- status ---';       $st = & $exe status | Out-String; Write-Host $st
          if ($st -notmatch 'app\.ufoagent\.xyz') { throw 'configure did not persist' }
          Write-Host '--- update ---';       & $exe update
          Write-Host '--- link --help ---';  & $exe link --help | Out-Null
          $r = Invoke-WebRequest 'https://app.ufoagent.xyz/v1/agent/version' -UseBasicParsing -TimeoutSec 20
          if ($r.StatusCode -ne 200) { throw 'control plane unreachable from the node' }
          Write-Host 'standard commands OK'

      - name: Capture install diagnostics (always)
        if: always()
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'diag'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $pd = "$env:ProgramData\UFOAgent"
          Write-Host '===== Inno install log ====='
          if ($env:INNO_LOG -and (Test-Path $env:INNO_LOG)) {
            Get-Content $env:INNO_LOG | Write-Host
            Copy-Item $env:INNO_LOG $diag -ErrorAction SilentlyContinue
          } else { Write-Host '(no inno log)' }
          Write-Host '===== agent log (ufoagent.log, tail) ====='
          $alog = Join-Path $pd 'logs\ufoagent.log'
          if (Test-Path $alog) {
            Get-Content $alog -Tail 200 | Write-Host
            Copy-Item $alog (Join-Path $diag 'ufoagent.log') -ErrorAction SilentlyContinue
          } else { Write-Host '(no agent log yet)' }
          Write-Host '===== config.json ====='
          $cfg = Join-Path $pd 'config.json'
          if (Test-Path $cfg) { Get-Content $cfg | Write-Host; Copy-Item $cfg $diag -ErrorAction SilentlyContinue }
          Write-Host '===== ProgramData\UFOAgent tree ====='
          if (Test-Path $pd) { Get-ChildItem -Recurse $pd | Select-Object FullName, Length | Format-Table -Auto | Out-String | Write-Host }
          Write-Host '===== service ====='
          sc.exe query UFOAgent | Out-String | Write-Host

      - name: Uninstall (always)
        if: always()
        shell: pwsh
        run: |
          Get-Process ufoagent -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $u = "$env:ProgramFiles\UFOAgent\unins000.exe"
          if (Test-Path $u) { Start-Process $u -ArgumentList '/VERYSILENT' -Wait; Write-Host 'uninstalled' }

      - name: Provision UFO2 with git removed from PATH (no-git zip path)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:UFOAGENT_HOME = Join-Path $env:RUNNER_TEMP 'ufoagent-e2e'
          $env:PATH = (($env:PATH -split ';') |
            Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'git.exe')) }) -join ';'
          if (Get-Command git -ErrorAction SilentlyContinue) { Write-Host 'note: git still resolvable' }
          else { Write-Host 'git removed from PATH' }
          & 'target\release\ufoagent.exe' bootstrap
          $st = & 'target\release\ufoagent.exe' status | Out-String
          Write-Host $st
          if ($st -match 'ufo_home:\s+\(unset\)') { throw 'bootstrap did not record a ufo_home' }
          if ($st -match 'python:\s+\(unset\)') { throw 'bootstrap did not record a python interpreter' }
          Write-Host 'auto-provision (no git) OK'

      - name: Capture provision log (always)
        if: always()
        shell: pwsh
        run: |
          $diag = Join-Path $env:RUNNER_TEMP 'diag'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $plog = Join-Path $env:RUNNER_TEMP 'ufoagent-e2e\logs\ufoagent.log'
          if (Test-Path $plog) {
            Write-Host '===== provision log (tail) ====='
            Get-Content $plog -Tail 200 | Write-Host
            Copy-Item $plog (Join-Path $diag 'provision-ufoagent.log') -ErrorAction SilentlyContinue
          } else { Write-Host '(no provision log)' }

      - name: Upload diagnostics (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/diag
          if-no-files-found: ignore
