[package]
name = "ufoagent"
version = "0.3.3"
edition = "2021"
description = "UFOAgent node agent — links a Windows machine running Microsoft UFO2 to the UFOAgent control plane and keeps short-lived LLM credentials fresh."
license = "Apache-2.0"
authors = ["UFOAgent, Inc."]
repository = "https://github.com/ufoagent/ufoagent-node"

[[bin]]
name = "ufoagent"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
simplelog = "0.12"
dirs = "5"
# Pure-Rust QR rendering for the link flow (default features drop image/svg → tiny; unicode render only).
qrcode = { version = "0.14", default-features = false }
# Sync WebSocket client (matches the ureq/threaded model) for the control-plane command channel.
# rustls + bundled webpki roots so wss:// works with no system TLS dependency.
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

# Windows-only (cfg-gated so `cargo check`/`test` run on macOS/Linux; built+verified in Windows CI).
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
tray-icon = "0.19"
tao = "0.30"
winreg = "0.52"
# PNG encoding for the on-demand desktop screenshot (capture.rs). No decoders/other formats → small.
image = { version = "0.25", default-features = false, features = ["png"] }
# UTF-8 console (QR glyphs) + Authenticode verification for self-update + GDI desktop capture.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
