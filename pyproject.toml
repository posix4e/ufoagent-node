[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ufoagentd"
description = "UFOAgent node daemon — links a Windows machine running Microsoft UFO2 to the UFOAgent control plane and keeps short-lived LLM credentials fresh."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "UFOAgent" }]
keywords = ["ufo2", "llm", "agent", "windows", "cloudflare", "automation"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
dynamic = ["version"]
dependencies = []  # daemon is pure standard library

[project.optional-dependencies]
windows = ["pywin32>=306"]      # DPAPI token protection
build = ["pyinstaller>=6.6"]    # produce ufoagentd.exe
dev = ["pyyaml", "ruff"]

[project.scripts]
ufoagentd = "ufoagentd.cli:main"

[project.urls]
Homepage = "https://ufoagent.xyz"
Source = "https://github.com/posix4e/ufoagent-node"

[tool.setuptools]
packages = ["ufoagentd"]

[tool.setuptools.dynamic]
version = { attr = "ufoagentd.__version__" }

[tool.ruff]
line-length = 120
